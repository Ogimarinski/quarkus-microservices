name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: ogimarinski

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [product-service, order-service]

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

      - name: Build native executable
        run: ./mvnw -B package -Pnative -Dquarkus.native.container-build=true -DskipTests

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE=${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          TAG=${GITHUB_SHA::7}
          docker build -f src/main/docker/Dockerfile.native-micro -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG