apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ogimarinski/order-service:9a9de4b
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shop-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shop
spec:
  type: LoadBalancer
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
