apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oracle-data
  namespace: shop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-db
  namespace: shop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oracle-db
  template:
    metadata:
      labels:
        app: oracle-db
    spec:
      containers:
        - name: oracle-db
          image: gvenzl/oracle-free:23-slim
          ports:
            - containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db-secret
                  key: ORACLE_PASSWORD
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: shop-db-secret
                  key: DB_USER
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: oracle-data
              mountPath: /opt/oracle/oradata
            - name: init-scripts
              mountPath: /container-entrypoint-initdb.d
      volumes:
        - name: oracle-data
          persistentVolumeClaim:
            claimName: oracle-data
        - name: init-scripts
          configMap:
            name: oracle-init
---
apiVersion: v1
kind: Service
metadata:
  name: oracle-db
  namespace: shop
spec:
  selector:
    app: oracle-db
  ports:
    - port: 1521
      targetPort: 1521