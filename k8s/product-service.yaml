apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: ogimarinski/product-service:9a9de4b
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shop-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shop
spec:
  type: LoadBalancer
  selector:
    app: product-service
  ports:
    - port: 8080
      targetPort: 8080